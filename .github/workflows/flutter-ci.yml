name: Full Flutter CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
    - "docs/**"
    - "README.md"

permissions:
  contents: read

concurrency:
  group: full-flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-ci:
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: false
