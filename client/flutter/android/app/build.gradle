import com.google.protobuf.gradle.*

plugins {
    id "com.google.protobuf" version "0.9.4"
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

repositories {
    maven { url 'https://maven.aliyun.com/repository/public' }
    google()
    mavenCentral()
}

protobuf {
    protoc {
        path = '/tmp/protoc3/bin/protoc'
    }

    generateProtoTasks {
        all().configureEach { task ->
            task.builtins {
                java {
                    option "lite"
                }
            }
        }
    }
}

android {
    compileSdkVersion 34
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'

        main.proto.srcDirs += '../../../libs/hbb_common/protos'
        main.proto.includes += "message.proto"
    }

    compileOptions {
        targetCompatibility JavaVersion.VERSION_1_8
        sourceCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.carriez.flutter_hbb"
        minSdkVersion 22
        targetSdkVersion 33
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
      release {
        // Using default debug keystore for now
        storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
        storePassword "android"
        keyAlias "androiddebugkey"
        keyPassword "android"
      }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules'
        }
        debug {
            // Debug uses default debug signing - no config needed
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'com.google.protobuf:protobuf-javalite:3.25.1'
    implementation "androidx.media:media:1.4.0"
    implementation 'com.github.getActivity:XXPermissions:18.5'
    implementation("org.jetbrains.kotlin:kotlin-stdlib") { version { strictly("1.8.22") } }
    implementation 'com.caverock:androidsvg-aar:1.4'
    // v1 removed: rustls not available in China
    // implementation "rustls:rustls-platform-verifier:0.1.1"
}

configurations.all {
    resolutionStrategy {
        force 'androidx.activity:activity:1.8.0'
        force 'androidx.core:core:1.12.0'
        force 'androidx.core:core-ktx:1.12.0'
        force 'androidx.media3:media3-common:1.3.0'
        force 'androidx.media3:media3-container:1.3.0'
        force 'androidx.media3:media3-database:1.3.0'
        force 'androidx.media3:media3-datasource:1.3.0'
        force 'androidx.media3:media3-decoder:1.3.0'
        force 'androidx.media3:media3-exoplayer:1.3.0'
        force 'androidx.media3:media3-exoplayer-dash:1.3.0'
        force 'androidx.media3:media3-exoplayer-hls:1.3.0'
        force 'androidx.media3:media3-exoplayer-rtsp:1.3.0'
        force 'androidx.media3:media3-exoplayer-smoothstreaming:1.3.0'
        force 'androidx.media3:media3-extractor:1.3.0'
        force 'androidx.annotation:annotation:1.7.0'
        force 'androidx.lifecycle:lifecycle-common:2.6.2'
        force 'androidx.lifecycle:lifecycle-runtime:2.6.2'
        force 'androidx.lifecycle:lifecycle-viewmodel:2.6.2'
        force 'androidx.arch.core:core-common:2.2.0'
        force 'androidx.arch.core:core-runtime:2.2.0'
    }
}
